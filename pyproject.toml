[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "steward-codeowners"
version = "0.1.0"
description = "Recency-weighted git authorship expertise CLI"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

[project.scripts]
steward = "steward.cli:main"

[tool.setuptools]
packages = ["steward"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
